<div class="white-wrapper">
    <section class="generator-section">
        <app-header-component [headerVariant]="'colored'"></app-header-component>

        <h1>Generate recipe</h1>
        <p class="generator-description">Got random stuff in your kitchen? Pop it in—we’ve got the perfect recipe waiting.</p>

        <article class="generator-selection">
            <div class="generator-ingredient">
                <form class="ingredient-form" [formGroup]="ingredientForm">
                    <div class="ingredient-input-area">
                        <label for="name">Ingredient</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            [formControl]="ingredientForm.controls.name"
                            (pointerenter)="onInputEnter('name')"
                            (pointerleave)="onInputLeave('name')"
                            >
                    </div>
                    <div class="ingredient-size-area">
                        <label for="unitCount">Serving size</label>
                        <input 
                            type="number" 
                            id="unitCount" 
                            name="unitCount" 
                            [min]="0" 
                            [formControl]="ingredientForm.controls.unitCount"
                            (pointerenter)="onInputEnter('unitCount')"
                            (pointerleave)="onInputLeave('unitCount')"
                            >
                        <app-unit-component
                            [isUnitSelected]="false"
                            [isUnitsListOpen]="isUnitListOpen()"
                            (isOpenChange)="isUnitListOpen.set($event)"
                            (sendUnitSelection)="onChooseUnit($event)"
                            class="unit-selector">{{currentUnit()}}
                        </app-unit-component>
                        <button type="submit" class="add-button">
                            <div class="add-button__icon"></div>
                        </button>
                    </div>
                </form>
            </div>

            <div class="generator-ingredient-list">
                <section class="ingredient-list">

                </section>
            </div>
        </article>


    </section>
</div>
