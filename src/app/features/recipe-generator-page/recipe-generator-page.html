<div class="white-wrapper">
    <section class="generator-section">
        <app-header-component 
            [headerVariant]="'colored'"
            (headerIconEvent)="goToHome()"
            [isClickable]="true"
            ></app-header-component>

        @if(currentStep() === 'stepOne'){
            <app-generate-step-1-component
                (nextStepEvent)="goToStepTwo()"    
            ></app-generate-step-1-component>
        }

        @if(currentStep() === 'stepTwo') {
            <app-generate-step-2-component>
                
            </app-generate-step-2-component>
        }
       
    </section>
</div>
