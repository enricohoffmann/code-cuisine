<div class="cookbook-wrapper">
    <section class="cookbook-section">
        <app-header-component [headerVariant]="'colored'" class="test"></app-header-component>

        <!-- Back to verher bin ich gekommen-->
        <app-call-to-action class="cta-back" [callToActionVariant]="'backward'"
            [colorVariant]="'colored'">Back</app-call-to-action>

        <main class="cookbook-main">

            <div class="cookbook-main-top">
                <h1 class="cookbook-main-top__title">Cookbook</h1>
                <p class="cookbook-main-top__description">From quick bites to gourmet delights,
                    explore them all in our ultimate cookbook and get
                    inspired for your next culinary adventure.</p>

                <aside class="cookbook-main-top__highlights">
                    <header class="highlights-header">
                        <h5>Most liked recipes</h5>
                        <div></div>
                    </header>

                    <!-- Meist genutze Rezepte -->
                    <div class="highlights-cards">
                        @for(number of [0,1,2,3]; track number) {
                            <app-most-liked-component></app-most-liked-component>
                        }
                    </div>

                </aside>
            </div>



            <!-- Rezeptübersicht als eigenes Grid -->
            <section class="cookbook-cuisine-categories">
                @for(number of [0, 1, 2, 3, 4, 5]; track number){
                    <app-cuisine-categorie-component></app-cuisine-categorie-component>
                }
            </section>

        </main>




        <!-- Forward zum Rezeptgenerator -->
        <app-call-to-action class="cta-forward mb-24" [colorVariant]="'colored'" (actionButtonEvent)="goToGenerator()">Generate new
            recipie</app-call-to-action>


        <!-- Footer -->
        <app-footer-component class="mb-32" [colorVariant]="'colored'"></app-footer-component>

    </section>
</div>
